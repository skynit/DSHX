server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    autoindex off;

    location = /latest.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
