- id: session-telemetry-otel
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('storages', 'sessions')
- id: attachment-local
  config:
    dshHome: !!js dshHomePath('storages')
- id: fs-sandbox
  disabled: true
- id: sandbox-policy
  config:
    mode: danger-full-access
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: danger-full-access
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- id: ui-permission
  disabled: true
- id: office-to-pdf
  disabled: true
- insert:
    - id: dshx-android-files
      name: 'file:@CORE@/files.mjs'
    - id: dshx-android-guard
      name: 'file:@CORE@/guard.mjs'
    - id: dshx-terminal-registry
      name: '@deepseek-ai/dsh-terminal'
    - id: dshx-terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
    - id: dshx-persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
    - id: dshx-isolated-bash
      name: '@deepseek-ai/dsh-tool-bash'
      config:
        enableRunInBackground: false
    - id: dshx-terminal-tools
      name: '@deepseek-ai/dsh-tool-terminal'
      config:
        enableRunInBackground: false
    - id: dshx-android-phone
      name: 'file:@CORE@/phone.mjs'
    - id: dshx-android-voice
      name: 'file:@CORE@/voice.mjs'
    - id: dshx-android-memory
      name: 'file:@CORE@/memory.mjs'
    - id: dshx-android-knowledge
      name: 'file:@CORE@/knowledge.mjs'
    - id: dshx-android-hosting
      name: 'file:@CORE@/hosting.mjs'
    - id: dshx-android-apps
      name: 'file:@CORE@/apps.mjs'
